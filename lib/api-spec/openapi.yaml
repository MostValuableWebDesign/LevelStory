            application/json:
              schema: { $ref: "#/components/schemas/CandidatePublication" }
  /strategy-proposals/{id}/activate:
    post:
      operationId: activateStrategyProposalCandidate
      tags: [governance]
      summary: Activate a candidate in Shadow Mode
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Active Shadow Mode version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidatePublication" }
  /strategy-proposals/{id}/retire:
    post:
      operationId: retireStrategyProposal
      tags: [governance]
      summary: Retire a candidate or active Shadow Mode version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Retired proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyProposal" }
  /strategy-proposals/{id}/rollback:
    post:
      operationId: rollbackStrategyProposal
      tags: [governance]
      summary: Roll back a Shadow Mode version without deleting history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceReasonInput" }
      responses:
        "200":
          description: Rolled-back proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyProposal" }
  /strategy-proposals/{id}/audit:
    get:
      operationId: getStrategyProposalAudit
      tags: [governance]
      summary: Read the append-only proposal audit history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Proposal detail including audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyProposalDetail" }
  /strategy-versions:
    get:
      operationId: listStrategyVersions
      tags: [governance]
      summary: List Shadow Mode strategy versions
      responses:
        "200":
          description: Strategy versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StrategyVersion" }
  /strategy-catalog:
    get:
      operationId: listStrategyCatalog
      tags: [governance]
      summary: List the four canonical strategies and their readiness
      responses:
        "200":
          description: Strategy catalog and independent readiness records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StrategyCatalogItem" }
  /strategy-catalog/{strategyKey}:
    get:
      operationId: getStrategyReadiness
      tags: [governance]
      summary: Get readiness for one canonical strategy
      parameters:
        - { name: strategyKey, in: path, required: true, schema: { $ref: "#/components/schemas/StrategyId" } }
      responses:
        "200":
          description: Strategy readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogItem" }
  /strategy-catalog/{strategyKey}/thresholds:
    patch:
      operationId: approveStrategyFitnessThresholds
      tags: [governance]
      summary: Set owner-approved fitness thresholds for one strategy
      parameters:
        - { name: strategyKey, in: path, required: true, schema: { $ref: "#/components/schemas/StrategyId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrategyThresholdsInput" }
      responses:
        "200":
          description: Updated strategy readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogItem" }
  /strategy-catalog/{strategyKey}/validate:
    post:
      operationId: validateStrategyReadiness
      tags: [governance]
      summary: Validate one strategy against its approved fitness thresholds
      parameters:
        - { name: strategyKey, in: path, required: true, schema: { $ref: "#/components/schemas/StrategyId" } }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogItem" }
  /strategy-catalog/{strategyKey}/activate-shadow:
    post:
      operationId: activateStrategyShadow
      tags: [governance]
      summary: Enable one FIT_AVAILABLE strategy in Shadow Mode
      parameters:
        - { name: strategyKey, in: path, required: true, schema: { $ref: "#/components/schemas/StrategyId" } }
      responses:
        "200":
          description: Activated strategy readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogItem" }
  /strategy-catalog/{strategyKey}/pause:
    post:
      operationId: pauseStrategy
      tags: [governance]
      summary: Pause one strategy without changing other strategies
      parameters:
        - { name: strategyKey, in: path, required: true, schema: { $ref: "#/components/schemas/StrategyId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceReasonInput" }
      responses:
        "200":
          description: Paused strategy readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogItem" }
  /strategy-catalog/{strategyKey}/resume:
    post:
      operationId: resumeStrategy
      tags: [governance]
      summary: Resume one paused strategy
      parameters:
        - { name: strategyKey, in: path, required: true, schema: { $ref: "#/components/schemas/StrategyId" } }
      responses:
        "200":
          description: Resumed strategy readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogItem" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    MarketDataQuality:
      type: object
      properties:
        valid: { type: boolean }
        stale: { type: boolean }
        delayed: { type: boolean }
        completeCandleCount: { type: number }
        incompleteCandleCount: { type: number }
        duplicateCount: { type: number }
        outOfOrderCount: { type: number }
        gapCount: { type: number }
        missingBidAskCount: { type: number }
        missingVolumeCount: { type: number }
        contractMismatchCount: { type: number }
        codes:
          type: array
          items: { type: string }
      required: [valid, stale, delayed, completeCandleCount, incompleteCandleCount, duplicateCount, outOfOrderCount, gapCount, missingBidAskCount, missingVolumeCount, contractMismatchCount, codes]
    MarketDataStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [simulated, csv, databento]
        state:
          type: string
          enum: [simulated, csv_replay, live_shadow, delayed_shadow, disconnected]
        connected: { type: boolean }
        authenticated: { type: boolean }
        delayed: { type: boolean }
        lastEventAt:
          type: ["string", "null"]
        checkedAt:
          type: string
        message: { type: string }
        dataOnly:
          type: boolean
          enum: [true]
        executionEnabled:
          type: boolean
          enum: [false]
        metadata:
          type: object
          properties:
            displayName: { type: string }
            dataset: { type: ["string", "null"] }
            contractSymbol: { type: string }
            contractMonth: { type: string }
            rolloverDate: { type: string }
          required: [displayName, dataset, contractSymbol, contractMonth, rolloverDate]
        quality:
          allOf:
            - $ref: "#/components/schemas/MarketDataQuality"
          nullable: true
      required: [provider, state, connected, authenticated, delayed, lastEventAt, checkedAt, message, dataOnly, executionEnabled, metadata, quality]
    Candle:
      type: object
      properties:
        time:
          type: string
        timestamp:
          type: string
        openTime:
          type: string
        closeTime:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
        isComplete:
          type: boolean
        bid:
          type: number
        ask:
          type: number
        bidSize:
          type: number
        askSize:
          type: number
        contractSymbol:
          type: string
      required: [time, timestamp, openTime, closeTime, open, high, low, close, volume, isComplete, bid, ask, bidSize, askSize, contractSymbol]
    SessionHours:
      type: object
      properties:
        timeZone:
          type: string
        start:
          type: string
        end:
          type: string
      required: [timeZone, start, end]
    FuturesContractSpecification:
      type: object
      properties:
        rootSymbol:
          type: string
        fullContractSymbol:
          type: string
        exchange:
          type: string
        contractMonth:
          type: string
        tickSize:
          type: number
        dollarValuePerTick:
          type: number
        pointValue:
          type: number
        contractMultiplier:
          type: number
        regularSessionHours:
          $ref: "#/components/schemas/SessionHours"
        commissionPerContract:
          type: number
        exchangeAndRegulatoryFeesPerContract:
          type: number
        exchangeFeePerContract:
          type: number
        regulatoryFeePerContract:
          type: number
        clearingFeePerContract:
          type: number
        maximumSpreadTicks:
          type: number
        minimumLiquidity:
          type: number
        rolloverDate:
          type: string
        configurable:
          type: boolean
        verificationNote:
          type: string
      required: [rootSymbol, fullContractSymbol, exchange, contractMonth, tickSize, dollarValuePerTick, pointValue, contractMultiplier, regularSessionHours, commissionPerContract, exchangeAndRegulatoryFeesPerContract, exchangeFeePerContract, regulatoryFeePerContract, clearingFeePerContract, maximumSpreadTicks, minimumLiquidity, rolloverDate, configurable, verificationNote]
    FuturesSessionCalendar:
      type: object
      properties:
        timeZone:
          type: string
        calendarVersion:
          type: string
          description: Versioned CME equity-index research calendar used for session and coverage classification.
        source:
          type: string
        verifiedOn:
          type: string
          format: date
        tradingDate:
          type: string
        premarketAvailable:
          type: boolean
        premarket:
          $ref: "#/components/schemas/SessionHours"
        regular:
          $ref: "#/components/schemas/SessionHours"
        holidays:
          type: array
          items:
            type: string
        earlyCloses:
          type: object
          additionalProperties:
            type: string
        maintenanceClosures:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                start: { type: string }
                end: { type: string }
                reason: { type: string }
              required: [start, end, reason]
      required: [timeZone, tradingDate, premarketAvailable, premarket, regular, holidays, earlyCloses]
    Signal:
      type: object
      properties:
        key:
          type: string
          enum: [orb, pullback, patience, volume]
        label:
          type: string
        status:
          type: string
          enum: [confirmed, watching, blocked]
        detail:
          type: string
      required: [key, label, status, detail]
    ReplayMetadata:
      type: object
      properties:
        tradingDate:
          type: string
        cursor:
          type: string
        visibleCandleCount:
          type: number
        timeZone:
          type: string
        barIntervalMinutes:
          type: number
          enum: [5]
      required: [tradingDate, cursor, visibleCandleCount, timeZone, barIntervalMinutes]
    CriticalLevel:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        kind:
          type: string
      required: [name, price, kind]
    MajorLevel:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [support, resistance]
        price:
          type: number
        zoneLow:
          type: number
        zoneHigh:
          type: number
        reactionCount:
          type: number
        strength:
          type: number
        recencyScore:
          type: number
        reactionMagnitude:
          type: number
        volumeScore:
          type: number
        components:
          type: array
          items:
            type: string
        componentCount:
          type: number
        confluence:
          type: string
          enum: [normal, strong, dynamite]
      required: [name, kind, price, zoneLow, zoneHigh, reactionCount, strength, recencyScore, reactionMagnitude, volumeScore, components, componentCount, confluence]
    LongTermZone:
      type: object
      properties:
        id: { type: string }
        lower: { type: number }
        upper: { type: number }
        midpoint: { type: number }
        role: { type: string, enum: [support, resistance, role-flip] }
        lookback: { type: string, enum: [six-month, one-year] }
        touchCount: { type: number }
        independentTradingDates: { type: array, items: { type: string } }
        firstTimestamp: { type: number }
        latestTimestamp: { type: number }
        sourcePivotTimestamps: { type: array, items: { type: number } }
        strength: { type: string, enum: [verified, strong] }
        detectorVersion: { type: string }
        configurationHash: { type: string }
      required: [id, lower, upper, midpoint, role, lookback, touchCount, independentTradingDates, firstTimestamp, latestTimestamp, sourcePivotTimestamps, strength, detectorVersion, configurationHash]
    DynamiteLevel:
      type: object
      properties:
        id: { type: string }
        lower: { type: number }
        upper: { type: number }
        representative: { type: number }
        includedLevelIds: { type: array, items: { type: string } }
        includedTypes: { type: array, items: { type: string } }
        includedLevelValues: { type: array, items: { type: number } }
        sourceFamilies: { type: array, items: { type: string } }
        confluenceCount: { type: number }
        observedAt: { type: number }
        pullbackInteracted: { type: boolean }
        pullbackInteractions:
          type: array
          items:
            type: object
            properties:
              eventId: { type: ["string", "null"] }
              eventTime: { type: number }
              candleOpenTime: { type: number }
              price: { type: number }
              level: { type: string }
            required: [eventId, eventTime, candleOpenTime, price, level]
      required: [id, lower, upper, representative, includedLevelIds, includedTypes, includedLevelValues, sourceFamilies, confluenceCount, observedAt, pullbackInteracted, pullbackInteractions]
    NtzState:
      type: object
      properties:
        status:
          type: string
          enum: [pending, inside, outside]
        phase:
          type: string
          enum: [pending, forming, completed]
        position:
          type: string
          enum: [unknown, inside, outside]
        complete:
          type: boolean
        high:
          type: ["number", "null"]
        low:
          type: ["number", "null"]
        events:
          type: array
          items:
            $ref: "#/components/schemas/NtzEvent"
      required: [status, phase, position, complete, high, low, events]
    NtzEvent:
      type: object
      properties:
        type:
          type: string
          enum: ["NTZ forming", "NTZ completed", "Price inside", "Close outside", "Break and reentry", "Break and retest", "Failed breakout", "Consolidation inside NTZ"]
        time:
          type: string
        detail:
          type: string
      required: [type, time, detail]
    BreakoutEvent:
      type: object
      properties:
        detected:
          type: boolean
        direction:
          type: ["string", "null"]
          enum: [long, short, null]
        state:
          type: string
          enum: [ORB_FORMING, INSIDE_ORB, ORB_PROBE_WAIT, WEAK_BREAK_WAIT, BREAKOUT_CANDIDATE, WAITING_FOR_CONTINUATION, QUALIFIED_BREAKOUT, WAITING_FOR_PULLBACK, PULLBACK_IN_PROGRESS, WAITING_FOR_PATIENCE_CANDLE, PATIENCE_CANDLE_VALID, TRIGGER_CANDLE_ACTIVE, ENTRY_TRIGGERED, BREAKOUT_FAILED, SETUP_EXPIRED]
        time:
          type: ["string", "null"]
        candleOpenTime:
          type: ["string", "null"]
        candidateTime:
          type: ["string", "null"]
        candidateCandleOpenTime:
          type: ["string", "null"]
        distanceOutside:
          type: ["number", "null"]
        meaningfulDistance:
          type: ["number", "null"]
        breakoutVolume:
          type: ["number", "null"]
        baselineVolume:
          type: ["number", "null"]
        volumeRatio:
          type: ["number", "null"]
        volumeSupported:
          type: boolean
        bodyRatio:
          type: ["number", "null"]
        closeLocationRatio:
          type: ["number", "null"]
        candleStructureSupported:
          type: boolean
        continuationConfirmed:
          type: boolean
        continuationCondition:
          type: ["string", "null"]
          enum: [IMMEDIATE_DIRECTIONAL_EXTENSION, ADDITIONAL_MEANINGFUL_MOVEMENT, TWO_CONSECUTIVE_CLOSES_OUTSIDE_ORB, OUTSIDE_ORB_CONSOLIDATION, STRONG_SINGLE_CANDLE_EXCEPTION, null]
        failed:
          type: boolean
        detail:
          type: string
      required: [detected, direction, state, time, candleOpenTime, candidateTime, candidateCandleOpenTime, distanceOutside, meaningfulDistance, breakoutVolume, baselineVolume, volumeRatio, volumeSupported, bodyRatio, closeLocationRatio, candleStructureSupported, continuationConfirmed, continuationCondition, failed, detail]
    PullbackEvent:
      type: object
      properties:
        type:
          type: string
          enum: [touch, proximity, "break and reclaim", hold, consolidation, "break through"]
        time:
          type: string
        level:
          type: string
        price:
          type: number
        distancePoints:
          type: number
        distanceTicks:
          type: number
        tolerancePoints:
          type: number
        toleranceTicks:
          type: number
        qualifies:
          type: boolean
        detail:
          type: string
      required: [type, time, level, price, distancePoints, distanceTicks, tolerancePoints, toleranceTicks, qualifies, detail]
    PullbackAnalysis:
      type: object
      properties:
        status:
          type: string
          enum: [pending, observed, expired]
