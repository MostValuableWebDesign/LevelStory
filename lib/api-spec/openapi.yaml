openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Simulated market intelligence
  - name: journal
    description: Shadow trade journal
  - name: risk
    description: Risk guardrails
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/snapshot:
    get:
      operationId: getMarketSnapshot
      tags: [market]
      summary: Get the simulated market snapshot
      description: Returns simulated five-minute candles, levels, indicators, and discipline signals. This endpoint never connects to a broker or places orders.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 12
            default: MES
        - name: session
          in: query
          required: false
          schema:
            type: string
            enum: [premarket, regular]
            default: regular
        - name: fibHigh
          in: query
          required: false
          description: Optional manual Fibonacci high anchor for descriptive replay analysis.
          schema:
            type: number
        - name: fibLow
          in: query
          required: false
          description: Optional manual Fibonacci low anchor for descriptive replay analysis.
          schema:
            type: number
        - name: targetDollars
          in: query
          required: false
          description: Selected profit target in dollars. Presets are $50, $75, and $100; custom values must remain within that range.
          schema:
            type: number
            minimum: 50
            maximum: 100
            default: 75
        - name: slippageMode
          in: query
          required: false
          description: Descriptive slippage regime used by the shadow cost model.
          schema:
            type: string
            enum: [normal, fast, abnormal_spread]
            default: normal
      responses:
        "200":
          description: Simulated market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"
        "400":
          description: Invalid market query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /futures/contracts:
    get:
      operationId: listFuturesContractSpecifications
      tags: [market]
      summary: List configurable simulated futures contracts
      description: Returns the configurable contract catalog used by the deterministic Shadow Mode feed. Values must be verified before any future provider integration.
      responses:
        "200":
          description: Futures contract specifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuturesContractSpecification"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [market]
      summary: Get dashboard overview
      description: Returns the current shadow session summary and recent journal activity.
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /journal:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List shadow journal entries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Record a shadow trade
      description: Records a simulated trade review only. It does not create a broker order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Invalid journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journal/{id}:
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a shadow journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Journal entry deleted
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risk/settings:
    get:
      operationId: getRiskSettings
      tags: [risk]
      summary: Get risk settings
      responses:
        "200":
          description: Risk settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSettings"
    patch:
      operationId: updateRiskSettings
      tags: [risk]
      summary: Update risk settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskSettingsUpdate"
      responses:
        "200":
          description: Updated risk settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSettings"
        "400":
          description: Invalid risk settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Candle:
      type: object
      properties:
        time:
          type: string
        timestamp:
          type: string
        openTime:
          type: string
        closeTime:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
        isComplete:
          type: boolean
        bid:
          type: number
        ask:
          type: number
        bidSize:
          type: number
        askSize:
          type: number
        contractSymbol:
          type: string
      required: [time, timestamp, openTime, closeTime, open, high, low, close, volume, isComplete, bid, ask, bidSize, askSize, contractSymbol]
    SessionHours:
      type: object
      properties:
        timeZone:
          type: string
        start:
          type: string
        end:
          type: string
      required: [timeZone, start, end]
    FuturesContractSpecification:
      type: object
      properties:
        rootSymbol:
          type: string
        fullContractSymbol:
          type: string
        exchange:
          type: string
        contractMonth:
          type: string
        tickSize:
          type: number
        dollarValuePerTick:
          type: number
        pointValue:
          type: number
        contractMultiplier:
          type: number
        regularSessionHours:
          $ref: "#/components/schemas/SessionHours"
        commissionPerContract:
          type: number
        exchangeAndRegulatoryFeesPerContract:
          type: number
        exchangeFeePerContract:
          type: number
        regulatoryFeePerContract:
          type: number
        clearingFeePerContract:
          type: number
        maximumSpreadTicks:
          type: number
        minimumLiquidity:
          type: number
        rolloverDate:
          type: string
        configurable:
          type: boolean
        verificationNote:
          type: string
      required: [rootSymbol, fullContractSymbol, exchange, contractMonth, tickSize, dollarValuePerTick, pointValue, contractMultiplier, regularSessionHours, commissionPerContract, exchangeAndRegulatoryFeesPerContract, exchangeFeePerContract, regulatoryFeePerContract, clearingFeePerContract, maximumSpreadTicks, minimumLiquidity, rolloverDate, configurable, verificationNote]
    FuturesSessionCalendar:
      type: object
      properties:
        timeZone:
          type: string
        tradingDate:
          type: string
        premarketAvailable:
          type: boolean
        premarket:
          $ref: "#/components/schemas/SessionHours"
        regular:
          $ref: "#/components/schemas/SessionHours"
        holidays:
          type: array
          items:
            type: string
        earlyCloses:
          type: object
          additionalProperties:
            type: string
      required: [timeZone, tradingDate, premarketAvailable, premarket, regular, holidays, earlyCloses]
    Signal:
      type: object
      properties:
        key:
          type: string
          enum: [orb, pullback, patience, volume]
        label:
          type: string
        status:
          type: string
          enum: [confirmed, watching, blocked]
        detail:
          type: string
      required: [key, label, status, detail]
    ReplayMetadata:
      type: object
      properties:
        cursor:
          type: string
        visibleCandleCount:
          type: number
        timeZone:
          type: string
        barIntervalMinutes:
          type: number
          enum: [5]
      required: [cursor, visibleCandleCount, timeZone, barIntervalMinutes]
    CriticalLevel:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        kind:
          type: string
      required: [name, price, kind]
    MajorLevel:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [support, resistance]
        price:
          type: number
        zoneLow:
          type: number
        zoneHigh:
          type: number
        reactionCount:
          type: number
        strength:
          type: number
        recencyScore:
          type: number
        reactionMagnitude:
          type: number
        volumeScore:
          type: number
        components:
          type: array
          items:
            type: string
        componentCount:
          type: number
        confluence:
          type: string
          enum: [normal, strong, dynamite]
      required: [name, kind, price, zoneLow, zoneHigh, reactionCount, strength, recencyScore, reactionMagnitude, volumeScore, components, componentCount, confluence]
    NtzState:
      type: object
      properties:
        status:
          type: string
          enum: [pending, inside, outside]
        phase:
          type: string
          enum: [pending, forming, completed]
        position:
          type: string
          enum: [unknown, inside, outside]
        complete:
          type: boolean
        high:
          type: ["number", "null"]
        low:
          type: ["number", "null"]
        events:
          type: array
          items:
            $ref: "#/components/schemas/NtzEvent"
      required: [status, phase, position, complete, high, low, events]
    NtzEvent:
      type: object
      properties:
        type:
          type: string
          enum: ["NTZ forming", "NTZ completed", "Price inside", "Close outside", "Break and reentry", "Break and retest", "Failed breakout", "Consolidation inside NTZ"]
        time:
          type: string
        detail:
          type: string
      required: [type, time, detail]
    BreakoutEvent:
      type: object
      properties:
        detected:
          type: boolean
        direction:
          type: ["string", "null"]
          enum: [long, short, null]
        time:
          type: ["string", "null"]
        candleOpenTime:
          type: ["string", "null"]
        distanceOutside:
          type: ["number", "null"]
        breakoutVolume:
          type: ["number", "null"]
        baselineVolume:
          type: ["number", "null"]
        volumeRatio:
          type: ["number", "null"]
        volumeSupported:
          type: boolean
        detail:
          type: string
      required: [detected, direction, time, candleOpenTime, distanceOutside, breakoutVolume, baselineVolume, volumeRatio, volumeSupported, detail]
    PullbackEvent:
      type: object
      properties:
        type:
          type: string
          enum: [touch, proximity, "break and reclaim", hold, consolidation, "break through"]
        time:
          type: string
        level:
          type: string
        price:
          type: number
        detail:
          type: string
      required: [type, time, level, price, detail]
    PullbackAnalysis:
      type: object
      properties:
        status:
          type: string
          enum: [pending, observed, expired]
        events:
          type: array
          items:
            $ref: "#/components/schemas/PullbackEvent"
        evaluatedCandles:
          type: number
        maxCandles:
          type: number
        maxDurationMinutes:
          type: number
        elapsedMinutes:
          type: number
        proximityTolerance:
          type: ["number", "null"]
        atr14:
          type: ["number", "null"]
        qualifyingLevelCount:
          type: number
        detail:
          type: string
      required: [status, events, evaluatedCandles, maxCandles, maxDurationMinutes, elapsedMinutes, proximityTolerance, atr14, qualifyingLevelCount, detail]
    FibonacciLevel:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        ratio:
          type: number
        price:
          type: number
      required: [name, label, ratio, price]
    FibonacciAnalysis:
      type: object
      properties:
        direction:
          type: ["string", "null"]
          enum: [bullish, bearish, null]
        impulseLow:
          type: ["number", "null"]
        impulseHigh:
          type: ["number", "null"]
        breakoutTime:
          type: ["string", "null"]
        frozen:
          type: boolean
        frozenAt:
          type: ["string", "null"]
        manualCorrection:
          type: boolean
        levels:
          type: array
          items:
            $ref: "#/components/schemas/FibonacciLevel"
        retracementPercent:
          type: ["number", "null"]
        classification:
          type: string
          enum: [shallow, normal, deep, "elevated failure risk", "fully retraced", unavailable]
        detail:
          type: string
      required: [direction, impulseLow, impulseHigh, breakoutTime, frozen, frozenAt, manualCorrection, levels, retracementPercent, classification, detail]
    VolumeAnalysis:
      type: object
      properties:
        baselineCandleCount:
          type: number
        recentSixAverage:
          type: ["number", "null"]
        breakoutVolume:
          type: ["number", "null"]
        breakoutRatio:
          type: ["number", "null"]
        supportingBreakoutVolume:
          type: boolean
        averageImpulseVolume:
          type: ["number", "null"]
        pullbackAverageVolume:
          type: ["number", "null"]
        pullbackToBreakoutRatio:
          type: ["number", "null"]
        pullbackToImpulseRatio:
          type: ["number", "null"]
        pullbackToRecentRatio:
          type: ["number", "null"]
        opposingPullbackVolume:
          type: ["number", "null"]
        reversalWarning:
          type: ["string", "null"]
      required: [baselineCandleCount, recentSixAverage, breakoutVolume, breakoutRatio, supportingBreakoutVolume, averageImpulseVolume, pullbackAverageVolume, pullbackToBreakoutRatio, pullbackToImpulseRatio, pullbackToRecentRatio, opposingPullbackVolume, reversalWarning]
    TrendEvidence:
      type: object
      properties:
        direction:
          type: string
          enum: [bullish, bearish, neutral]
        score:
          type: number
        evidence:
          type: array
          items:
            type: string
        structure:
          type: string
        candleCount:
          type: number
        evidenceItems:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum: [structure, vwap, ema, emaSlope]
              label:
                type: string
              status:
                type: string
                enum: [positive, negative, neutral]
              detail:
                type: string
            required: [key, label, status, detail]
      required: [direction, score, evidence, structure, candleCount, evidenceItems]
    RuleEvidence:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        detail:
          type: string
      required: [key, label, detail]
    StrategyDecision:
      type: object
      properties:
        state:
          type: string
          enum: ["NO TRADE", "WAITING", "SETUP FORMING", "SETUP QUALIFIED", "POSSIBLE REVERSAL", "RISK LOCKOUT"]
        explanation:
          type: string
        passedRules:
          type: array
          items:
            $ref: "#/components/schemas/RuleEvidence"
        failedRules:
          type: array
          items:
            $ref: "#/components/schemas/RuleEvidence"
      required: [state, explanation, passedRules, failedRules]
    RiskPlan:
      type: object
      properties:
        direction:
          type: string
          enum: [long, short]
        entry:
          type: ["number", "null"]
        thesisStop:
          type: ["number", "null"]
        catastropheStop:
          type: ["number", "null"]
        strategyStop:
          type: ["number", "null"]
        target:
          type: ["number", "null"]
        targetDollars:
          type: number
        targetTicks:
          type: number
        targetContracts:
          type: number
        runnerContracts:
          type: number
        contracts:
          type: number
        stopTicks:
          type: number
        riskPerContract:
          type: number
        dollarRisk:
          type: number
        allowed:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        slippageMode:
          type: string
          enum: [normal, fast, abnormal_spread]
        costBreakdown:
          type: object
          properties:
            commission: { type: number }
            exchange: { type: number }
            regulatory: { type: number }
            clearing: { type: number }
            roundTripFees: { type: number }
            entrySlippage: { type: number }
            exitSlippage: { type: number }
            totalSlippage: { type: number }
          required: [commission, exchange, regulatory, clearing, roundTripFees, entrySlippage, exitSlippage, totalSlippage]
        projectedTargetPnl:
          type: object
          properties:
            grossPnl: { type: number }
            slippage: { type: number }
            fees: { type: number }
            netPnl: { type: number }
          required: [grossPnl, slippage, fees, netPnl]
        runner:
          $ref: "#/components/schemas/RunnerState"
        locks:
          type: object
          additionalProperties:
            type: boolean
      required: [direction, entry, thesisStop, catastropheStop, strategyStop, target, targetDollars, targetTicks, targetContracts, runnerContracts, contracts, stopTicks, riskPerContract, dollarRisk, allowed, slippageMode, costBreakdown, projectedTargetPnl, runner, locks, reasons]
    RunnerState:
      type: object
      properties:
        active: { type: boolean }
        referencePrice: { type: ["number", "null"] }
        impulse: { type: ["number", "null"] }
        mostFavorablePrice: { type: ["number", "null"] }
        adverseRetracement: { type: number }
        retracementThreshold: { type: ["number", "null"] }
        exit: { type: boolean }
        exitReason: { type: ["string", "null"] }
      required: [active, referencePrice, impulse, mostFavorablePrice, adverseRetracement, retracementThreshold, exit, exitReason]
    LevelStoryEvent:
      type: object
      properties:
        time:
          type: string
        level:
          type: string
        interaction:
          type: string
        detail:
          type: string
      required: [time, level, interaction, detail]
    ReversalState:
      type: object
      properties:
        doji:
          type: boolean
        equivalentCandles:
          type: boolean
        warning:
          type: ["string", "null"]
      required: [doji, equivalentCandles, warning]
    PatienceCandle:
      type: object
      properties:
        openTime:
          type: string
        closeTime:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        isComplete:
          type: boolean
      required: [openTime, closeTime, open, high, low, close, isComplete]
    PatienceAnalysis:
      type: object
      properties:
        state:
          type: string
          enum:
            - WAITING FOR PATIENCE CANDLE
            - PATIENCE CANDLE FORMING
            - VALID PATIENCE CANDLE
            - TRIGGER CANDLE ACTIVE
            - ENTRY TRIGGERED
            - INVALIDATED
            - EXPIRED
            - AMBIGUOUS
        eligible:
          type: boolean
        eligibilityReason:
          type: ["string", "null"]
          enum: [pullback, consolidation, "ntz consolidation", null]
        eligibilityTime:
          type: ["string", "null"]
        patienceCandle:
          oneOf:
            - $ref: "#/components/schemas/PatienceCandle"
            - type: "null"
        triggerCandle:
          oneOf:
            - $ref: "#/components/schemas/PatienceCandle"
            - type: "null"
        triggerPrice:
          type: ["number", "null"]
        stateTime:
          type: ["string", "null"]
        detail:
          type: string
      required: [state, eligible, eligibilityReason, eligibilityTime, patienceCandle, triggerCandle, triggerPrice, stateTime, detail]
    SetupRule:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        passed:
          type: boolean
        mandatory:
          type: boolean
        detail:
          type: string
      required: [key, label, passed, mandatory, detail]
    ReversalEvidence:
      type: object
      properties:
        dojiAtMajorLevel:
          type: boolean
        equivalentOpposingCandles:
          type: boolean
        failedBreakout:
          type: boolean
        strongOpposingVolume:
          type: boolean
        deepFibonacciRetracement:
          type: boolean
        majorLevelRejection:
          type: boolean
        structureBreak:
          type: boolean
        alert:
          type: boolean
        detail:
          type: string
      required: [dojiAtMajorLevel, equivalentOpposingCandles, failedBreakout, strongOpposingVolume, deepFibonacciRetracement, majorLevelRejection, structureBreak, alert, detail]
    ExtendedConsolidation:
      type: object
      properties:
        detected:
          type: boolean
        candleCount:
          type: number
        durationMinutes:
          type: number
        insideOrNearCount:
          type: number
        range:
          type: ["number", "null"]
        expansionRatio:
          type: ["number", "null"]
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        detail:
          type: string
      required: [detected, candleCount, durationMinutes, insideOrNearCount, range, expansionRatio, startTime, endTime, detail]
    SetupEvaluation:
      type: object
      properties:
        setupType:
          type: string
          enum: [ORB_BREAK_PULLBACK_CONTINUATION, EXTENDED_NTZ_CONSOLIDATION_BREAKOUT, BONUS_REVERSAL]
        direction:
          type: ["string", "null"]
          enum: [long, short, null]
        decision:
          type: string
          enum: ["NO TRADE", "WAITING", "SETUP FORMING", "SETUP QUALIFIED", "POSSIBLE REVERSAL", "EXPIRED", "AMBIGUOUS"]
        mandatoryPassed:
          type: boolean
        alertOnly:
          type: boolean
        rules:
          type: array
          items:
            $ref: "#/components/schemas/SetupRule"
        reversalEvidence:
          oneOf:
            - $ref: "#/components/schemas/ReversalEvidence"
            - type: "null"
        consolidation:
          oneOf:
            - $ref: "#/components/schemas/ExtendedConsolidation"
            - type: "null"
        explanation:
          type: string
      required: [setupType, direction, decision, mandatoryPassed, alertOnly, rules, reversalEvidence, consolidation, explanation]
    SetupAnalysis:
      type: object
      properties:
        decision:
          type: string
          enum: ["NO TRADE", "WAITING", "SETUP FORMING", "SETUP QUALIFIED", "POSSIBLE REVERSAL", "EXPIRED", "AMBIGUOUS"]
        primarySetup:
          type: ["string", "null"]
          enum: [ORB_BREAK_PULLBACK_CONTINUATION, EXTENDED_NTZ_CONSOLIDATION_BREAKOUT, BONUS_REVERSAL, null]
        explanation:
          type: string
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/SetupEvaluation"
      required: [decision, primarySetup, explanation, evaluations]
    MarketSnapshot:
      type: object
      properties:
        mode:
          type: string
          enum: ["SHADOW MODE — NO LIVE ORDERS"]
        symbol:
          type: string
        company:
          type: string
        contract:
          $ref: "#/components/schemas/FuturesContractSpecification"
        sessionCalendar:
          $ref: "#/components/schemas/FuturesSessionCalendar"
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
        marketStatus:
          type: string
          enum: [premarket, open, closed]
        session:
          type: string
        updatedAt:
          type: string
        replay:
          $ref: "#/components/schemas/ReplayMetadata"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        levels:
          type: object
          properties:
            premarketHigh: { type: ["number", "null"] }
            premarketLow: { type: ["number", "null"] }
            previousDayHigh: { type: ["number", "null"] }
            previousDayLow: { type: ["number", "null"] }
            previousDayClose: { type: ["number", "null"] }
            dayBeforeYesterdayHigh: { type: ["number", "null"] }
            dayBeforeYesterdayLow: { type: ["number", "null"] }
            openingRangeHigh: { type: ["number", "null"] }
            openingRangeLow: { type: ["number", "null"] }
            ntzHigh: { type: ["number", "null"] }
            ntzLow: { type: ["number", "null"] }
            ntzWidth: { type: ["number", "null"] }
            vwap: { type: ["number", "null"] }
            critical:
              type: array
              items:
                $ref: "#/components/schemas/CriticalLevel"
