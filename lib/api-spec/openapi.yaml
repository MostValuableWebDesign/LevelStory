        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceReasonInput" }
      responses:
        "200":
          description: Rejected proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyProposal" }
  /strategy-proposals/{id}/publish:
    post:
      operationId: publishStrategyProposalCandidate
      tags: [governance]
      summary: Publish an approved proposal as a Shadow Mode candidate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Candidate publication
