openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Provider-backed market intelligence
  - name: journal
    description: Shadow trade journal
  - name: risk
    description: Risk guardrails
  - name: backtest
    description: Causal historical replay and shadow backtesting
  - name: governance
    description: Persistent teaching evidence and Shadow Mode strategy governance
  - name: Auth
    description: Browser session authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/snapshot:
    get:
      operationId: getMarketSnapshot
      tags: [market]
      summary: Get the simulated market snapshot
      description: Returns simulated five-minute candles, levels, indicators, and discipline signals. This endpoint never connects to a broker or places orders.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 12
            default: MES
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum: [simulated, csv, databento]
        - name: session
          in: query
          required: false
          schema:
            type: string
            enum: [premarket, regular]
            default: regular
        - name: tradingDate
          in: query
          required: false
          description: New York trading date for the deterministic replay. Defaults to the latest trading date in the session calendar.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Replay cursor as a Unix timestamp in milliseconds. When supplied, only candles completed by this instant are visible.
          schema:
            type: number
        - name: premarketAvailable
          in: query
          required: false
          description: Whether premarket candles are available for this replay.
          schema:
            type: boolean
        - name: fibHigh
          in: query
          required: false
          description: Optional manual Fibonacci high anchor for descriptive replay analysis.
          schema:
            type: number
        - name: fibLow
          in: query
          required: false
          description: Optional manual Fibonacci low anchor for descriptive replay analysis.
          schema:
            type: number
        - name: targetDollars
          in: query
          required: false
          description: Selected profit target in dollars. Presets are $50, $75, and $100; custom values must remain within that range.
          schema:
            type: number
            minimum: 50
            maximum: 100
            default: 75
        - name: slippageMode
          in: query
          required: false
          description: Descriptive slippage regime used by the shadow cost model.
          schema:
            type: string
            enum: [normal, fast, abnormal_spread]
            default: normal
      responses:
        "200":
          description: Simulated market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"
        "400":
          description: Invalid market query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /market/data-status:
    get:
      operationId: getMarketDataStatus
      tags: [market]
      summary: Get market-data provider status
      description: Returns server-side provider health and normalized data-quality metadata. This endpoint never exposes credentials or creates an order.
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum: [simulated, csv, databento]
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: MES
        - name: tradingDate
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Provider health and data quality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataStatus"
        "400":
          description: Invalid provider or market query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /futures/contracts:
    get:
      operationId: listFuturesContractSpecifications
      tags: [market]
      summary: List configurable simulated futures contracts
      description: Returns the configurable contract catalog used by the deterministic Shadow Mode feed. Values must be verified before any future provider integration.
      responses:
        "200":
          description: Futures contract specifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuturesContractSpecification"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [market]
      summary: Get dashboard overview
      description: Returns the selected New York trading-date shadow session summary and recent journal activity.
      parameters:
        - name: tradingDate
          in: query
          required: false
          description: New York trading date to summarize. Defaults to the latest trading date in the session calendar.
          schema:
            type: string
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /backtest:
    post:
      operationId: runBacktest
      tags: [backtest]
      summary: Run a causal shadow backtest
      description: Replays deterministic futures data through the existing strategy without future-candle access, broker access, or order creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRequest"
      responses:
        "200":
          description: Causal backtest report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestReport"
        "400":
          description: Invalid backtest request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/batch:
    post:
      operationId: startBatchBacktest
      tags: [backtest]
      summary: Start a deterministic multi-period qualification batch
      description: Runs the existing causal backtest one trading date and active contract at a time. Results are persisted only after every partition completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchBacktestRequest"
      responses:
        "202":
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBacktestStatus"
        "400":
          description: Invalid batch request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Batch capacity is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/batch-status:
    get:
      operationId: getBatchBacktestStatus
      tags: [backtest]
      summary: Read batch progress or completed results
      parameters:
        - name: batchId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "200":
          description: Batch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBacktestStatus"
        "404":
          description: Batch not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/batch-cancel:
    delete:
      operationId: cancelBatchBacktest
      tags: [backtest]
      summary: Cancel a running qualification batch
      parameters:
        - name: batchId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBacktestStatus"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/batch-funnel:
    get:
      operationId: getBatchFunnel
      tags: [backtest]
      summary: Read a page of unique batch qualification candidates
      parameters:
        - name: batchId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        - name: stage
          in: query
          schema:
            type: string
            enum: [session_loaded, ntz_orb_completed, strong_breakout_candidate, strong_continuation_confirmed, pullback_or_consolidation, critical_level_interaction, fibonacci_context_available, volume_condition_passed, valid_trend_aligned_patience_candle, immediate_next_candle_confirmation, risk_approved, modeled_entry, final_exit]
        - name: page
          in: query
          schema: { type: number, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: number, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Funnel candidate page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchFunnelPage"
        "404":
          description: Batch not found, incomplete, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/edge-pilot:
    post:
      operationId: startEdgeValidationPilot
      tags: [backtest]
      summary: Start the bounded Phase 3 historical edge-validation pilot
      description: Runs exactly 20 chronological in-sample and 10 later untouched out-of-sample MES sessions from the ready multi-contract historical index. The pilot is immutable, resumable, causal, and Shadow Mode only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeValidationPilotRequest"
      responses:
        "202":
          description: Pilot accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeValidationPilotStatus"
        "400":
          description: Invalid pilot request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A pilot is already running or the Phase 2G gate is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The ready historical index is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/edge-pilot-status:
    get:
      operationId: getEdgeValidationPilotStatus
      tags: [backtest]
      summary: Read Phase 3 pilot progress or evidence
      parameters:
        - name: pilotId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "200":
          description: Pilot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeValidationPilotStatus"
        "404":
          description: Pilot not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/edge-pilot-cancel:
    delete:
      operationId: cancelEdgeValidationPilot
      tags: [backtest]
      summary: Cancel a running Phase 3 pilot
      parameters:
        - name: pilotId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeValidationPilotStatus"
        "404":
          description: Pilot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/audit:
    get:
      operationId: getBacktestAuditPage
      tags: [backtest]
      summary: Read a bounded page of a causal backtest audit
      parameters:
        - name: runId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        - name: page
          in: query
          schema: { type: number, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: number, minimum: 1, maximum: 100, default: 50 }
        - name: decision
          in: query
          schema: { type: string, maxLength: 80 }
        - name: date
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: setup
          in: query
          schema: { type: string, maxLength: 100 }
        - name: patience
          in: query
          schema: { type: string, maxLength: 80 }
        - name: category
          in: query
          schema: { type: string, enum: [WAITING, FAILURE, EXPIRED, AMBIGUITY, RISK_REJECTION, POSITION_ACTIVE, QUALIFIED] }
        - name: ambiguity
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: One stable page of the causal audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestAuditPage"
        "404":
          description: Run expired or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/visual-validation:
    get:
      operationId: getVisualValidationSet
      tags: [backtest]
      summary: Generate or retrieve deterministic visual-validation snapshots
      description: Creates a bounded, simulation-only set of annotated setup snapshots. Each snapshot contains only candles visible at its causal evaluation cursor.
      parameters:
        - name: reviewSetId
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        - name: symbol
          in: query
          required: false
          schema: { type: string, enum: [MES], default: MES }
        - name: endDate
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', default: "2026-08-26" }
        - name: inSampleDays
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 10, default: 5 }
        - name: outOfSampleDays
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 10, default: 2 }
        - name: seed
          in: query
          required: false
          schema: { type: number, minimum: 0, maximum: 1000000, default: 11 }
        - name: reviewMode
          in: query
          required: false
          schema: { type: string, enum: [trades_only, confirmed_signals, trades_and_diagnostics], default: trades_only }
      responses:
        "200":
          description: Visual-validation snapshot set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationSet"
        "404":
          description: Review set not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createVisualValidationSet
      tags: [backtest]
      summary: Create a deterministic visual-validation snapshot set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualValidationRequest"
      responses:
        "200":
          description: Visual-validation snapshot set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationSet"
        "400":
          description: Invalid visual-validation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Historical visual-review source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/visual-validation/replay:
    get:
      operationId: getShadowAccountReplay
      tags: [backtest]
      summary: Replay candidate-owned visual-validation trades in a shadow account
      description: Recomputes a read-only dummy-money account from the selected Visual Review set. It never creates signals, connects to a broker, or places orders.
      parameters:
        - name: reviewSetId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        - name: startingBalance
          in: query
          required: false
          schema: { type: number, exclusiveMinimum: 0, default: 10000 }
        - name: contractsPerTrade
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 100, default: 1 }
      responses:
        "200":
          description: Shadow account replay result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShadowAccountReplay"
        "400":
          description: Invalid replay options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review set not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/visual-validation/generation-jobs:
    post:
      operationId: startVisualValidationGenerationJob
      tags: [backtest]
      summary: Start or reuse a deterministic visual-validation generation job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualValidationRequest"
      responses:
        "200":
          description: Queued, active, or cached visual-validation generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationGenerationJob"
        "400":
          description: Invalid visual-validation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getLatestVisualValidationGenerationJob
      tags: [backtest]
      summary: Retrieve the latest visual-validation generation job
      responses:
        "200":
          description: Latest active or completed visual-validation generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationGenerationJob"
        "404":
          description: No generation job is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/visual-validation/generation-jobs/{jobId}:
    get:
      operationId: getVisualValidationGenerationJob
      tags: [backtest]
      summary: Retrieve visual-validation generation progress
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "200":
          description: Current generation progress or completed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationGenerationJob"
        "404":
          description: Generation job not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/visual-validation/reviews:
    post:
      operationId: recordVisualValidationReview
      tags: [backtest]
      summary: Record a human visual-validation label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualValidationReviewRequest"
      responses:
        "200":
          description: Stored review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationReview"
        "404":
          description: Review set or snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/visual-validation/discrepancies:
    get:
      operationId: exportVisualValidationDiscrepancies
      tags: [backtest]
      summary: Export human-machine discrepancy evidence
      parameters:
        - name: reviewSetId
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "200":
          description: Discrepancy report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationDiscrepancyReport"
        "404":
          description: Review set not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backtest/visual-validation/proposed-rule-analysis:
    post:
      operationId: analyzeVisualValidationTeaching
      tags: [backtest]
      summary: Analyze teaching examples as an advisory rule hypothesis
      description: Returns non-mutating support and conflict analysis. It never changes the active formula or starts a backtest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualValidationProposedRuleAnalysisRequest"
      responses:
        "200":
          description: Advisory proposed-rule analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualValidationProposedRuleAnalysis"
        "404":
          description: Review set not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /historical-data:
    get:
      operationId: getHistoricalData
      tags: [backtest]
      summary: Get the imported historical Databento CSV result
      description: Returns validation and aggregation statistics for the server-side MESU6 OHLCV-1m import. The file is processed without requiring a Databento API key.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            enum: [MES]
            default: MES
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [historical_databento, historical_databento_multicontract]
            default: historical_databento
      responses:
        "200":
          description: Historical CSV import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalImportSummary"
        "400":
          description: Historical CSV import failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /historical-data/status:
    get:
      operationId: getHistoricalDataIndexStatus
      tags: [backtest]
      summary: Get historical MES index readiness
      description: Returns the reusable multi-contract MES index lifecycle without exposing server file paths.
      responses:
        "200":
          description: Historical MES index status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDataIndexStatus"
        "503":
          description: Historical MES index failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDataIndexStatus"
  /historical-data/ema-comparison:
    get:
      operationId: getHistoricalEmaComparison
      tags: [backtest]
      summary: Compare independently calculated EMA values at uploaded-history timestamps
      description: Returns candidate MES timestamps and up to three selected comparisons. This is an audit report, not a broker-equivalence claim.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [historical_databento, historical_databento_multicontract]
            default: historical_databento_multicontract
        - name: timestamps
          in: query
          required: false
          description: Comma-separated UTC candle-open timestamps; at most three are compared.
          schema: { type: string }
      responses:
        "200":
          description: Independent EMA comparison report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalEmaComparisonReport"
        "400":
          description: Historical EMA comparison failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journal:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List shadow journal entries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 20
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: setupType
          in: query
          required: false
          schema:
            type: string
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [long, short]
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [qualified, rejected, expired, ambiguous]
        - name: tradingDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Record a shadow trade
      description: Records a simulated trade review only. It does not create a broker order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Invalid journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journal/{id}:
    get:
      operationId: getJournalEntry
      tags: [journal]
      summary: Get one shadow journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Shadow journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a shadow journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Journal entry deleted
        "404":
          description: Journal entry not found
          content:
